<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>HYBRID Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --bg-card: #1a1a1a;
    --bg-input: #222;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #f0f0f0;
    --text-muted: #888;
    --text-dim: #555;
    --accent: #d4ff00;
    --accent-dark: #a8cc00;
    --work: #4ade80;
    --work-bg: rgba(74, 222, 128, 0.15);
    --rest: #fbbf24;
    --rest-bg: rgba(251, 191, 36, 0.15);
    --bigrest: #f472b6;
    --bigrest-bg: rgba(244, 114, 182, 0.15);
    --prep: #60a5fa;
    --prep-bg: rgba(96, 165, 250, 0.15);
    --reps: #a78bfa;
    --reps-bg: rgba(167, 139, 250, 0.15);
    --done: #34d399;
    --done-bg: rgba(52, 211, 153, 0.15);
    --danger: #f87171;
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; }
  body { padding: 16px; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 20px; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
  .logo-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; }

  /* TABS */
  .mode-tabs { display: flex; gap: 4px; background: var(--bg-elev); padding: 4px; border-radius: var(--radius); margin-bottom: 18px; }
  .mode-tab { flex: 1; padding: 10px 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; border: none; background: transparent; color: var(--text-muted); border-radius: 7px; cursor: pointer; transition: all 0.15s; }
  .mode-tab.active { background: var(--accent); color: #000; }

  /* SOUND TEST */
  .sound-test { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-elev); border-radius: var(--radius); margin-bottom: 16px; font-size: 12px; color: var(--text-muted); border: 1px solid var(--border); }
  .sound-test button { padding: 6px 14px; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: 0.5px; background: transparent; color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; cursor: pointer; text-transform: uppercase; }
  .sound-test button:active { transform: scale(0.96); }

  /* STAGE DISPLAY */
  .stage-display { background: var(--bg-elev); border-radius: var(--radius-lg); padding: 28px 20px 24px; text-align: center; margin-bottom: 16px; transition: background 0.3s; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .stage-display.work { background: var(--work-bg); border-color: rgba(74,222,128,0.3); }
  .stage-display.rest { background: var(--rest-bg); border-color: rgba(251,191,36,0.3); }
  .stage-display.bigrest { background: var(--bigrest-bg); border-color: rgba(244,114,182,0.3); }
  .stage-display.prep { background: var(--prep-bg); border-color: rgba(96,165,250,0.3); }
  .stage-display.reps { background: var(--reps-bg); border-color: rgba(167,139,250,0.3); }
  .stage-display.done { background: var(--done-bg); border-color: rgba(52,211,153,0.3); }

  .stage-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .stage-display.work .stage-label { color: var(--work); }
  .stage-display.rest .stage-label { color: var(--rest); }
  .stage-display.bigrest .stage-label { color: var(--bigrest); }
  .stage-display.prep .stage-label { color: var(--prep); }
  .stage-display.reps .stage-label { color: var(--reps); }
  .stage-display.done .stage-label { color: var(--done); }

  .stage-time { font-family: 'Bebas Neue', sans-serif; font-size: 88px; line-height: 0.95; letter-spacing: 1px; color: var(--text); margin: 0; }
  .stage-name { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; margin-top: 10px; color: var(--text); }
  .stage-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); margin-top: 8px; letter-spacing: 0.5px; }
  .stage-counters { display: flex; justify-content: center; gap: 20px; margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
  .stage-counters b { font-weight: 600; color: var(--text); font-size: 14px; margin-left: 4px; }
  .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; margin-top: 18px; }
  .progress-fill { height: 100%; background: currentColor; transition: width 0.2s linear; opacity: 0.6; }
  .stage-display.work .progress-fill { background: var(--work); }
  .stage-display.rest .progress-fill { background: var(--rest); }
  .stage-display.bigrest .progress-fill { background: var(--bigrest); }
  .stage-display.prep .progress-fill { background: var(--prep); }
  .stage-display.reps .progress-fill { background: var(--reps); }

  .reps-done-btn { margin-top: 16px; padding: 12px 24px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; background: var(--accent); color: #000; border: none; border-radius: var(--radius); cursor: pointer; }
  .reps-done-btn:active { transform: scale(0.97); }

  /* CONTROLS */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .controls button { padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .controls button:active:not(:disabled) { transform: scale(0.97); }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .controls .primary { grid-column: 1 / -1; background: var(--accent); color: #000; border-color: var(--accent); }
  .controls .primary:active:not(:disabled) { background: var(--accent-dark); }

  /* SECTIONS */
  .section-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text-muted); margin: 18px 0 10px; text-transform: uppercase; letter-spacing: 1.5px; display: flex; justify-content: space-between; align-items: center; }
  .section-title .hint { font-size: 10px; font-weight: 400; color: var(--text-dim); text-transform: none; letter-spacing: 0; }

  /* PRESETS */
  .preset-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
  .preset-btn { padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.5px; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; text-align: center; }
  .preset-btn:active { transform: scale(0.97); background: var(--bg-card); }

  /* SLIDERS */
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .row label { font-size: 13px; color: var(--text-muted); flex: 1; }
  .row .val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; min-width: 50px; text-align: right; color: var(--text); }
  input[type="range"] { -webkit-appearance: none; appearance: none; flex: 2; height: 4px; background: var(--bg-input); border-radius: 2px; outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; cursor: pointer; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--border-strong); }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: var(--accent); border-radius: 50%; cursor: pointer; border: 3px solid var(--bg); }

  input[type="text"], input[type="number"], select {
    background: var(--bg-input); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s;
  }
  input[type="number"] { font-family: 'JetBrains Mono', monospace; text-align: right; }
  input:focus, select:focus { border-color: var(--accent); }
  select { cursor: pointer; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='%23888'><path d='M1 1l5 5 5-5'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; background-size: 10px; padding-right: 26px; }

  /* TOTAL INFO */
  .total-info { background: var(--bg-elev); padding: 12px 14px; border-radius: var(--radius); font-size: 13px; color: var(--text-muted); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
  .total-info .total-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent); font-size: 14px; }

  /* CUSTOM LIST */
  .custom-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; max-height: 320px; overflow-y: auto; padding: 2px; }
  .custom-list::-webkit-scrollbar { width: 4px; }
  .custom-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  .custom-item { display: flex; align-items: center; gap: 6px; background: var(--bg-elev); padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border); }
  .custom-item .idx { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); min-width: 18px; }
  .custom-item select { padding: 5px 22px 5px 8px; font-size: 11px; width: 80px; background-size: 8px; background-position: right 6px center; }
  .custom-item .name-inp { flex: 1; min-width: 0; padding: 5px 8px; font-size: 12px; }
  .custom-item .dur-inp { width: 52px; padding: 5px 8px; font-size: 12px; }
  .custom-item .sec { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); min-width: 26px; }
  .custom-item .del { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 6px; font-size: 16px; line-height: 1; }
  .custom-item .del:active { color: var(--danger); }

  .add-row { display: grid; grid-template-columns: 88px 1fr 64px 36px; gap: 6px; align-items: center; }
  .add-row select { padding: 8px 22px 8px 10px; font-size: 12px; }
  .add-row button { padding: 8px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: 600; line-height: 1; }
  .add-row button:active { background: var(--accent-dark); }

  /* SAVE */
  .save-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 14px; margin-top: 16px; }
  .save-row input { padding: 9px 12px; font-size: 13px; }
  .save-row button { padding: 9px 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; background: var(--accent); color: #000; border: none; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .save-row button:active { background: var(--accent-dark); }

  .saved-list { display: flex; flex-direction: column; gap: 6px; }
  .saved-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-elev); border-radius: var(--radius); border: 1px solid var(--border); }
  .saved-item .saved-info { flex: 1; min-width: 0; padding-right: 8px; }
  .saved-item .saved-name { font-size: 14px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-item .saved-meta { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .saved-item .saved-actions { display: flex; gap: 4px; }
  .saved-item .saved-actions button { padding: 6px 10px; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; }
  .saved-item .saved-actions button.load { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .saved-item .saved-actions button:active { transform: scale(0.95); }
  .empty-state { text-align: center; padding: 20px; font-size: 12px; color: var(--text-dim); font-style: italic; background: var(--bg-elev); border-radius: var(--radius); border: 1px dashed var(--border); }

  .hidden { display: none !important; }

  /* TOAST */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 18px; border-radius: var(--radius); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000; animation: toast-in 0.3s ease-out; max-width: 90%; text-align: center; }
  @keyframes toast-in { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="logo-dot"></span>
    <span>HYBRID</span>
  </div>
  <div class="logo-sub">Timer</div>
</div>

<div class="mode-tabs" role="tablist">
  <button class="mode-tab active" data-mode="simple">Einfach</button>
  <button class="mode-tab" data-mode="circuit">Zirkel</button>
  <button class="mode-tab" data-mode="custom">Frei</button>
</div>

<div class="sound-test">
  <span>🔊 Sound-Check</span>
  <button id="soundTest">Test piepsen</button>
</div>

<div class="stage-display prep" id="display">
  <p class="stage-label" id="stageLabel">Bereit</p>
  <p class="stage-time" id="stageTime">00:00</p>
  <p class="stage-name hidden" id="stageName"></p>
  <p class="stage-meta" id="stageMeta">Drück Start</p>
  <div class="stage-counters hidden" id="stageCounters">
    <span>Übung<b id="exCount">–</b></span>
    <span>Runde<b id="rdCount">–</b></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <button class="reps-done-btn hidden" id="repsDoneBtn">✓ Fertig — weiter</button>
</div>

<div class="controls">
  <button class="primary" id="startBtn">▶ Start</button>
  <button id="pauseBtn" disabled>⏸ Pause</button>
  <button id="resetBtn">↻ Reset</button>
</div>

<div id="simplePanel">
  <p class="section-title"><span>Schnell-Auswahl</span></p>
  <div class="preset-row">
    <button class="preset-btn" data-preset="tabata">⚡ Tabata · 20/10</button>
    <button class="preset-btn" data-preset="hiit">🔥 HIIT · 40/20</button>
    <button class="preset-btn" data-preset="emom">⏱ EMOM · 60/0</button>
    <button class="preset-btn" data-preset="classic">🎯 Klassik · 60/15</button>
  </div>
  <p class="section-title"><span>Einstellungen</span></p>
  <div class="row"><label for="workSec">Übung</label><input type="range" id="workSec" min="5" max="300" step="5" value="60"><span class="val" id="workSecVal">60s</span></div>
  <div class="row"><label for="restSec">Pause</label><input type="range" id="restSec" min="0" max="180" step="5" value="15"><span class="val" id="restSecVal">15s</span></div>
  <div class="row"><label for="rounds">Runden</label><input type="range" id="rounds" min="1" max="30" step="1" value="8"><span class="val" id="roundsVal">8</span></div>
  <div class="row"><label for="prepSec">Vorlauf</label><input type="range" id="prepSec" min="0" max="30" step="1" value="10"><span class="val" id="prepSecVal">10s</span></div>
  <div class="total-info"><span>Gesamtdauer</span><span class="total-val" id="simpleTotal">8:50</span></div>
</div>

<div id="circuitPanel" class="hidden">
  <p class="section-title"><span>Zirkel-Aufbau</span></p>
  <div class="row"><label for="cExercises">Übungen pro Runde</label><input type="range" id="cExercises" min="2" max="12" step="1" value="4"><span class="val" id="cExercisesVal">4</span></div>
  <div class="row"><label for="cRounds">Runden</label><input type="range" id="cRounds" min="1" max="10" step="1" value="3"><span class="val" id="cRoundsVal">3</span></div>
  <div class="row"><label for="cWork">Übung</label><input type="range" id="cWork" min="10" max="180" step="5" value="40"><span class="val" id="cWorkVal">40s</span></div>
  <div class="row"><label for="cRest">Pause zw. Übung</label><input type="range" id="cRest" min="0" max="120" step="5" value="15"><span class="val" id="cRestVal">15s</span></div>
  <div class="row"><label for="cBigRest">Pause zw. Runde</label><input type="range" id="cBigRest" min="0" max="240" step="10" value="60"><span class="val" id="cBigRestVal">60s</span></div>
  <div class="row"><label for="cPrep">Vorlauf</label><input type="range" id="cPrep" min="0" max="30" step="1" value="10"><span class="val" id="cPrepVal">10s</span></div>
  <div class="total-info"><span>Gesamtdauer</span><span class="total-val" id="circuitTotal">0:00</span></div>
</div>

<div id="customPanel" class="hidden">
  <p class="section-title"><span>Deine Sätze</span><span class="hint">Reps = ohne Timer</span></p>
  <div class="custom-list" id="customList"></div>
  <div class="add-row">
    <select id="addType">
      <option value="work">Übung</option>
      <option value="rest">Pause</option>
      <option value="prep">Vorlauf</option>
      <option value="reps">Reps</option>
    </select>
    <input type="text" id="addName" placeholder="Name (optional)">
    <input type="number" id="addDur" min="1" max="999" value="45">
    <button id="addBtn" aria-label="Hinzufügen">+</button>
  </div>
  <div class="total-info" style="margin-top: 12px;"><span><span id="customCount">0</span> Sätze · <span id="customReps">0</span> Reps</span><span class="total-val" id="customTotal">0:00</span></div>

  <div class="save-row">
    <input type="text" id="saveName" placeholder="Trainings-Name…">
    <button id="saveBtn">💾 Speichern</button>
  </div>

  <p class="section-title"><span>Gespeicherte Trainings</span></p>
  <div id="savedWrap">
    <div class="empty-state" id="savedEmpty">Noch nichts gespeichert.</div>
    <div class="saved-list hidden" id="savedList"></div>
  </div>
</div>

<script>
(function() {
  // ---------- STATE ----------
  let mode = 'simple';
  let queue = [];
  let qIndex = 0;
  let remaining = 0;
  let stageTotal = 0;
  let running = false;
  let ticker = null;
  let audioCtx = null;
  let audioUnlocked = false;
  let wakeLock = null;
  let waitingForReps = false;
  let lastBeepedSecond = -1;
  let customSteps = [
    { type: 'prep', duration: 10, name: '' },
    { type: 'work', duration: 45, name: 'Burpees' },
    { type: 'rest', duration: 15, name: '' },
    { type: 'reps', reps: 10, name: 'Klimmzüge' },
    { type: 'rest', duration: 30, name: '' },
    { type: 'work', duration: 45, name: 'Plank' },
  ];
  let savedWorkouts = [];
  const STORAGE_KEY = 'hybrid:timer:workouts';

  // ---------- ELEMENTS ----------
  const $ = id => document.getElementById(id);
  const display = $('display');
  const stageLabel = $('stageLabel');
  const stageTime = $('stageTime');
  const stageName = $('stageName');
  const stageMeta = $('stageMeta');
  const stageCounters = $('stageCounters');
  const exCount = $('exCount');
  const rdCount = $('rdCount');
  const progressFill = $('progressFill');
  const startBtn = $('startBtn');
  const pauseBtn = $('pauseBtn');
  const resetBtn = $('resetBtn');
  const repsDoneBtn = $('repsDoneBtn');
  const simplePanel = $('simplePanel');
  const circuitPanel = $('circuitPanel');
  const customPanel = $('customPanel');
  const customList = $('customList');
  const savedList = $('savedList');
  const savedEmpty = $('savedEmpty');

  // ---------- HELPERS ----------
  const fmt = (s) => {
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  };

  const TYPE = {
    work:    { label: 'Übung',  cls: 'work' },
    rest:    { label: 'Pause',  cls: 'rest' },
    bigrest: { label: 'Rundenpause', cls: 'bigrest' },
    prep:    { label: 'Vorlauf', cls: 'prep' },
    reps:    { label: 'Wiederholungen', cls: 'reps' },
  };

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  // ---------- AUDIO ----------
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioUnlocked = true;
      return true;
    } catch (e) { return false; }
  }
  function beep(freq, dur, vol, type) {
    if (!audioUnlocked) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = type || 'square';
      const v = vol || 0.5;
      const t = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(v, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }
  $('soundTest').addEventListener('click', () => {
    const ok = ensureAudio();
    if (!ok) { toast('Audio blockiert vom Browser'); return; }
    // Demo: 5x Countdown-Pieps + 1x lauter End-Pieps + Vibration
    beep(700, 0.12, 0.5); vibrate(60);
    setTimeout(() => { beep(700, 0.12, 0.5); vibrate(60); }, 400);
    setTimeout(() => { beep(700, 0.12, 0.5); vibrate(60); }, 800);
    setTimeout(() => { beep(700, 0.12, 0.5); vibrate(60); }, 1200);
    setTimeout(() => { beep(700, 0.12, 0.5); vibrate(60); }, 1600);
    setTimeout(() => { beep(1100, 0.4, 0.65); vibrate([200, 80, 200]); }, 2000);
  });

  // ---------- WAKE LOCK (Display anlassen) ----------
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWakeLock();
  });

  // ---------- STORAGE ----------
  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) savedWorkouts = JSON.parse(raw);
    } catch (e) { savedWorkouts = []; }
    renderSaved();
  }
  function persistSaved() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedWorkouts)); } catch (e) {}
  }
  function renderSaved() {
    if (savedWorkouts.length === 0) {
      savedEmpty.classList.remove('hidden');
      savedList.classList.add('hidden');
      return;
    }
    savedEmpty.classList.add('hidden');
    savedList.classList.remove('hidden');
    savedList.innerHTML = '';
    savedWorkouts.forEach((w, i) => {
      const dur = w.steps.reduce((a, s) => a + (s.type === 'reps' ? 0 : (s.duration || 0)), 0);
      const repCount = w.steps.filter(s => s.type === 'reps').length;
      const item = document.createElement('div');
      item.className = 'saved-item';
      const nameDiv = document.createElement('div');
      nameDiv.className = 'saved-info';
      const nameEl = document.createElement('div');
      nameEl.className = 'saved-name';
      nameEl.textContent = w.name;
      const metaEl = document.createElement('div');
      metaEl.className = 'saved-meta';
      metaEl.textContent = `${w.steps.length} Sätze · ${fmt(dur)}${repCount ? ' · ' + repCount + ' Reps' : ''}`;
      nameDiv.append(nameEl, metaEl);
      const actions = document.createElement('div');
      actions.className = 'saved-actions';
      actions.innerHTML = `<button class="load" data-load="${i}">Laden</button><button data-del="${i}">🗑</button>`;
      item.append(nameDiv, actions);
      savedList.appendChild(item);
    });
  }
  savedList.addEventListener('click', (e) => {
    const loadBtn = e.target.closest('[data-load]');
    const delBtn = e.target.closest('[data-del]');
    if (loadBtn) {
      const i = +loadBtn.dataset.load;
      customSteps = JSON.parse(JSON.stringify(savedWorkouts[i].steps));
      renderCustomList();
      resetTimer();
      toast(`„${savedWorkouts[i].name}" geladen`);
    }
    if (delBtn) {
      const i = +delBtn.dataset.del;
      if (confirm(`„${savedWorkouts[i].name}" wirklich löschen?`)) {
        savedWorkouts.splice(i, 1);
        persistSaved();
        renderSaved();
      }
    }
  });
  $('saveBtn').addEventListener('click', () => {
    const name = $('saveName').value.trim();
    if (!name) { toast('Name fehlt'); $('saveName').focus(); return; }
    if (customSteps.length === 0) { toast('Keine Sätze zum Speichern'); return; }
    savedWorkouts.unshift({ name, steps: JSON.parse(JSON.stringify(customSteps)), savedAt: Date.now() });
    $('saveName').value = '';
    persistSaved();
    renderSaved();
    toast(`„${name}" gespeichert`);
  });

  // ---------- MODE SWITCHING ----------
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.addEventListener('click', () => {
      if (running || waitingForReps) return;
      document.querySelectorAll('.mode-tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      mode = t.dataset.mode;
      simplePanel.classList.toggle('hidden', mode !== 'simple');
      circuitPanel.classList.toggle('hidden', mode !== 'circuit');
      customPanel.classList.toggle('hidden', mode !== 'custom');
      resetTimer();
    });
  });

  // ---------- SIMPLE ----------
  [['workSec','s'],['restSec','s'],['rounds',''],['prepSec','s']].forEach(([id, suffix]) => {
    $(id).addEventListener('input', () => { $(id + 'Val').textContent = $(id).value + suffix; updateSimpleTotal(); });
  });
  function updateSimpleTotal() {
    const w = +$('workSec').value, r = +$('restSec').value, n = +$('rounds').value, p = +$('prepSec').value;
    $('simpleTotal').textContent = fmt(p + n * w + Math.max(0, n - 1) * r);
  }
  updateSimpleTotal();

  const PRESETS = {
    tabata:  { workSec: 20, restSec: 10, rounds: 8,  prepSec: 10 },
    hiit:    { workSec: 40, restSec: 20, rounds: 10, prepSec: 10 },
    emom:    { workSec: 60, restSec: 0,  rounds: 10, prepSec: 10 },
    classic: { workSec: 60, restSec: 15, rounds: 8,  prepSec: 10 },
  };
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.addEventListener('click', () => {
      if (running) return;
      const p = PRESETS[b.dataset.preset];
      Object.entries(p).forEach(([k, v]) => {
        $(k).value = v;
        $(k + 'Val').textContent = v + (k === 'rounds' ? '' : 's');
      });
      updateSimpleTotal();
    });
  });

  // ---------- CIRCUIT ----------
  [['cExercises',''],['cRounds',''],['cWork','s'],['cRest','s'],['cBigRest','s'],['cPrep','s']].forEach(([id, suffix]) => {
    $(id).addEventListener('input', () => { $(id + 'Val').textContent = $(id).value + suffix; updateCircuitTotal(); });
  });
  function updateCircuitTotal() {
    const ex = +$('cExercises').value, rd = +$('cRounds').value, w = +$('cWork').value, r = +$('cRest').value, br = +$('cBigRest').value, p = +$('cPrep').value;
    const oneRound = ex * w + Math.max(0, ex - 1) * r;
    $('circuitTotal').textContent = fmt(p + rd * oneRound + Math.max(0, rd - 1) * br);
  }
  updateCircuitTotal();

  // ---------- CUSTOM LIST ----------
  function renderCustomList() {
    customList.innerHTML = '';
    customSteps.forEach((step, i) => {
      const isReps = step.type === 'reps';
      const item = document.createElement('div');
      item.className = 'custom-item';
      const idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = (i + 1);
      const sel = document.createElement('select'); sel.className = 'type-sel'; sel.dataset.i = i;
      ['work','rest','prep','reps'].forEach(v => {
        const o = document.createElement('option');
        o.value = v; o.textContent = ({work:'Übung',rest:'Pause',prep:'Vorlauf',reps:'Reps'})[v];
        if (step.type === v) o.selected = true;
        sel.appendChild(o);
      });
      const nameInp = document.createElement('input');
      nameInp.type = 'text'; nameInp.className = 'name-inp'; nameInp.dataset.i = i;
      nameInp.placeholder = isReps ? 'Übungsname' : 'Name (optional)';
      nameInp.value = step.name || '';
      const durInp = document.createElement('input');
      durInp.type = 'number'; durInp.className = 'dur-inp'; durInp.dataset.i = i;
      durInp.min = 1; durInp.max = 999;
      durInp.value = isReps ? (step.reps || 10) : (step.duration || 30);
      const sec = document.createElement('span'); sec.className = 'sec'; sec.textContent = isReps ? 'reps' : 's';
      const del = document.createElement('button'); del.className = 'del'; del.dataset.i = i; del.setAttribute('aria-label', 'Löschen'); del.textContent = '×';
      item.append(idx, sel, nameInp, durInp, sec, del);
      customList.appendChild(item);
    });
    $('customCount').textContent = customSteps.length;
    const timeBlocks = customSteps.filter(s => s.type !== 'reps');
    const repsBlocks = customSteps.filter(s => s.type === 'reps');
    $('customReps').textContent = repsBlocks.length;
    $('customTotal').textContent = fmt(timeBlocks.reduce((a, s) => a + (s.duration || 0), 0));
  }
  customList.addEventListener('change', (e) => {
    const i = +e.target.dataset.i;
    if (isNaN(i)) return;
    if (e.target.classList.contains('type-sel')) {
      const newType = e.target.value;
      const old = customSteps[i];
      if (newType === 'reps' && old.type !== 'reps') customSteps[i] = { type: 'reps', reps: 10, name: old.name || '' };
      else if (newType !== 'reps' && old.type === 'reps') customSteps[i] = { type: newType, duration: 30, name: old.name || '' };
      else customSteps[i].type = newType;
      renderCustomList();
    }
    if (e.target.classList.contains('dur-inp')) {
      const v = Math.max(1, +e.target.value || 1);
      if (customSteps[i].type === 'reps') customSteps[i].reps = v;
      else customSteps[i].duration = v;
      renderCustomList();
    }
  });
  customList.addEventListener('input', (e) => {
    const i = +e.target.dataset.i;
    if (!isNaN(i) && e.target.classList.contains('name-inp')) customSteps[i].name = e.target.value;
  });
  customList.addEventListener('click', (e) => {
    const btn = e.target.closest('.del');
    if (btn && !running) { customSteps.splice(+btn.dataset.i, 1); renderCustomList(); }
  });
  $('addBtn').addEventListener('click', () => {
    if (running) return;
    const type = $('addType').value;
    const name = $('addName').value.trim();
    const val = Math.max(1, +$('addDur').value || 1);
    if (type === 'reps') customSteps.push({ type, reps: val, name });
    else customSteps.push({ type, duration: val, name });
    $('addName').value = '';
    renderCustomList();
  });
  $('addType').addEventListener('change', () => {
    const t = $('addType').value;
    $('addDur').value = t === 'reps' ? 10 : (t === 'prep' ? 10 : t === 'rest' ? 15 : 45);
  });
  renderCustomList();

  // ---------- BUILD QUEUE ----------
  function buildQueue() {
    if (mode === 'simple') {
      const w = +$('workSec').value, r = +$('restSec').value, n = +$('rounds').value, p = +$('prepSec').value;
      const q = [];
      if (p > 0) q.push({ type: 'prep', duration: p });
      for (let i = 0; i < n; i++) {
        q.push({ type: 'work', duration: w, round: i + 1, totalRounds: n });
        if (r > 0 && i < n - 1) q.push({ type: 'rest', duration: r, nextRound: i + 2, totalRounds: n });
      }
      return q;
    }
    if (mode === 'circuit') {
      const ex = +$('cExercises').value, rd = +$('cRounds').value, w = +$('cWork').value, r = +$('cRest').value, br = +$('cBigRest').value, p = +$('cPrep').value;
      const q = [];
      if (p > 0) q.push({ type: 'prep', duration: p });
      for (let round = 1; round <= rd; round++) {
        for (let e = 1; e <= ex; e++) {
          q.push({ type: 'work', duration: w, exercise: e, totalEx: ex, round, totalRounds: rd });
          if (e < ex && r > 0) q.push({ type: 'rest', duration: r, exercise: e, totalEx: ex, round, totalRounds: rd, nextEx: e + 1 });
        }
        if (round < rd && br > 0) q.push({ type: 'bigrest', duration: br, round, totalRounds: rd, nextRound: round + 1 });
      }
      return q;
    }
    return customSteps.map((s, i) => ({ ...s, step: i + 1, totalSteps: customSteps.length }));
  }

  // ---------- TIMER ENGINE ----------
  function setStage(step) {
    const info = TYPE[step.type];
    display.className = 'stage-display ' + info.cls;
    stageLabel.textContent = info.label;
    progressFill.style.width = '0%';

    if (step.name) { stageName.textContent = step.name; stageName.classList.remove('hidden'); }
    else stageName.classList.add('hidden');

    if (step.type === 'reps') {
      waitingForReps = true;
      stageTime.textContent = step.reps + '×';
      stageMeta.textContent = mode === 'custom' ? `Satz ${step.step} / ${step.totalSteps}` : '';
      stageCounters.classList.add('hidden');
      repsDoneBtn.classList.remove('hidden');
      remaining = 0;
      stageTotal = 0;
      if (ticker) { clearInterval(ticker); ticker = null; }
      beep(750, 0.25, 0.55);
      vibrate([100, 50, 100]);
      return;
    }

    waitingForReps = false;
    repsDoneBtn.classList.add('hidden');
    remaining = step.duration;
    stageTotal = step.duration;
    lastBeepedSecond = -1;
    stageTime.textContent = fmt(remaining);

    stageCounters.classList.add('hidden');
    if (mode === 'simple') {
      if (step.type === 'prep') stageMeta.textContent = 'Gleich geht\'s los';
      else if (step.type === 'work') stageMeta.textContent = `Runde ${step.round} / ${step.totalRounds}`;
      else if (step.type === 'rest') stageMeta.textContent = `Pause vor Runde ${step.nextRound}`;
    } else if (mode === 'circuit') {
      if (step.type === 'prep') stageMeta.textContent = 'Gleich geht\'s los';
      else if (step.type === 'bigrest') stageMeta.textContent = `Pause vor Runde ${step.nextRound} / ${step.totalRounds}`;
      else {
        stageMeta.textContent = '';
        stageCounters.classList.remove('hidden');
        exCount.textContent = step.type === 'work' ? `${step.exercise} / ${step.totalEx}` : `→ ${step.nextEx} / ${step.totalEx}`;
        rdCount.textContent = `${step.round} / ${step.totalRounds}`;
      }
    } else {
      stageMeta.textContent = `Satz ${step.step} / ${step.totalSteps}`;
    }
  }

  function advance() {
    qIndex++;
    if (qIndex >= queue.length) { finish(); return; }
    setStage(queue[qIndex]);
    if (!ticker && !waitingForReps && running) ticker = setInterval(tick, 100);
  }

  function tick() {
    if (waitingForReps) return;
    remaining -= 0.1;
    if (remaining <= 0) {
      // Wechsel: lauter End-Pieps + kräftige Vibration
      beep(1100, 0.4, 0.65);
      vibrate([200, 80, 200]);
      lastBeepedSecond = -1;
      advance();
      return;
    }
    // Anzeige zeigt Math.ceil(remaining). Bei remaining=4.95 zeigt sie "5", bei 3.95 → "4", etc.
    // Wir piepen einmal pro angezeigter Sekunde von 5 bis 1.
    const displayedSec = Math.ceil(remaining);
    if (displayedSec <= 5 && displayedSec >= 1 && displayedSec !== lastBeepedSecond) {
      lastBeepedSecond = displayedSec;
      beep(700, 0.12, 0.5);
      vibrate(60);
    }
    stageTime.textContent = fmt(remaining);
    progressFill.style.width = (100 * (1 - remaining / stageTotal)) + '%';
  }

  repsDoneBtn.addEventListener('click', () => {
    if (!waitingForReps) return;
    waitingForReps = false;
    advance();
  });

  function start() {
    if (running && !waitingForReps) return;
    ensureAudio();
    requestWakeLock();
    if (qIndex === 0 && remaining === 0 && !waitingForReps) {
      queue = buildQueue();
      if (queue.length === 0) return;
      setStage(queue[0]);
    }
    running = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    pauseBtn.innerHTML = '⏸ Pause';
    if (!waitingForReps && !ticker) ticker = setInterval(tick, 100);
    beep(800, 0.15, 0.5);
  }

  function pause() {
    if (waitingForReps) return;
    if (!running) {
      running = true;
      pauseBtn.innerHTML = '⏸ Pause';
      ticker = setInterval(tick, 100);
      requestWakeLock();
    } else {
      running = false;
      pauseBtn.innerHTML = '▶ Weiter';
      clearInterval(ticker);
      ticker = null;
    }
  }

  function resetTimer() {
    running = false;
    waitingForReps = false;
    clearInterval(ticker);
    ticker = null;
    releaseWakeLock();
    qIndex = 0; remaining = 0; stageTotal = 0; queue = [];
    display.className = 'stage-display prep';
    stageLabel.textContent = 'Bereit';
    stageTime.textContent = '00:00';
    stageName.classList.add('hidden');
    stageMeta.textContent = 'Drück Start';
    stageCounters.classList.add('hidden');
    repsDoneBtn.classList.add('hidden');
    progressFill.style.width = '0%';
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    pauseBtn.innerHTML = '⏸ Pause';
  }

  function finish() {
    clearInterval(ticker);
    ticker = null;
    running = false;
    waitingForReps = false;
    releaseWakeLock();
    display.className = 'stage-display done';
    stageLabel.textContent = 'Fertig';
    stageTime.textContent = '✓';
    stageName.classList.add('hidden');
    stageMeta.textContent = 'Stark durchgezogen';
    stageCounters.classList.add('hidden');
    repsDoneBtn.classList.add('hidden');
    progressFill.style.width = '100%';
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    qIndex = 0; remaining = 0;
    beep(700, 0.15, 0.5);
    setTimeout(() => beep(900, 0.15, 0.5), 180);
    setTimeout(() => beep(1100, 0.3, 0.55), 360);
    setTimeout(() => beep(1300, 0.4, 0.55), 600);
    vibrate([100, 50, 100, 50, 100, 50, 300]);
  }

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', resetTimer);

  loadSaved();
})();
</script>

</body>
</html>
